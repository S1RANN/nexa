schema = 2
contract = "language_scale.contract.nexa"
required_entrypoints = ["on_event"]

[[sources]]
id = "language-scale"
root = "packages"
trust = "first-party"
activation = ["default-enabled"]
capabilities = ["diagnostics.log"]
allow_entitlement = false
max_packages = 4

[sources.limits]
handler_fuel = 20000
cumulative_budget = 100000
heap_objects = 1024
heap_bytes = 67108864
string_bytes = 1048576
collection_bytes = 33554432
host_resources = 32
tasks = 4
release_records = 64
