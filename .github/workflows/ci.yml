name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
          - name: Windows x86_64
            os: windows-2025
          - name: macOS arm64
            os: macos-15

    steps:
      - uses: actions/checkout@v4
      - name: Record runner architecture
        run: rustc -vV
      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --check
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-targets
      - name: Test documentation
        run: cargo test --doc --workspace
      - name: Run combat integration
        run: cargo run -p combat-runtime --quiet
      - name: Run benchmark smoke
        run: cargo run -p nexa-runtime --example fast_task_bench --features allocation-counting -- --smoke
      - name: Observe real allocator hot paths
        if: runner.os != 'Windows'
        run: cargo run --manifest-path tools/allocation-observer/Cargo.toml --quiet
      - name: Check baseline
        run: cargo run -p nexa-cli -- baseline check
      - name: Check machine specifications
        run: cargo run -p nexa-cli -- machine check
      - name: Check generated machine code
        run: cargo run -p nexa-machine -- check-generated
      - name: Check bounded models
        run: cargo run -p nexa-cli -- model check
      - name: Upload failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            target/model-artifacts/shortest-failure.json
            target/model-artifacts/model-check-summary.json
            target/model-artifacts/realm-v4-failure.json
            target/runtime-traces/
