[package]
name = "nexa-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nexa-bytecode = { path = "../nexa-bytecode" }
nexa-compiler = { path = "../nexa-compiler", optional = true }
nexa-core = { path = "../nexa-core" }
nexa-contract = { path = "../nexa-contract", optional = true }
nexa-verifier = { path = "../nexa-verifier" }

[dev-dependencies]
nexa-compiler = { path = "../nexa-compiler" }
nexa-contract = { path = "../nexa-contract" }

[features]
allocation-counting = []
fuzzing = ["model-adapter"]
model-adapter = ["dep:nexa-compiler", "dep:nexa-contract"]
profiler-overhead-control = []

# M5 K1: the runtime hosts the single sanctioned unsafe kernel
# (src/trusted.rs). The crate lowers the workspace's `forbid` to `deny`
# so exactly that module can opt in with `#![allow(unsafe_code)]`; every
# other module stays effectively forbidden, and `cargo xtask repo-audit`
# fails if `unsafe` appears anywhere else under crates/. The clippy table
# mirrors the workspace lints verbatim.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
