[package]
name = "nexa-idl"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3.workspace = true
nexa-bytecode = { path = "../nexa-bytecode" }
nexa-core = { path = "../nexa-core" }
nexa-syntax = { path = "../nexa-syntax" }
prettyplease = "0.2"
