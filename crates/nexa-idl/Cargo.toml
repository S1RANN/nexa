quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
nexa-compiler = { path = "../nexa-compiler" }
nexa-runtime = { path = "../nexa-runtime", features = ["model-adapter"] }
nexa-verifier = { path = "../nexa-verifier" }
serde_json.workspace = true

[lints]
workspace = true
