schema = 2
contract = "examples/snake-game/snake_api.contract.nexa"
required_entrypoints = ["on_event"]

[[sources]]
id = "snake-builtin"
root = "examples/snake-game/packages/builtin"
trust = "first-party"
activation = ["required", "default-enabled"]
capabilities = [
    "diagnostics.log",
    "skin.register",
    "spawn.propose",
    "spawn.register",
    "stats.read",
    "ui.register",
    "ui.update",
]
allow_entitlement = false
max_packages = 16

[sources.limits]
handler_fuel = 30000
cumulative_budget = 200000
heap_objects = 4096
heap_bytes = 67108864
string_bytes = 1048576
collection_bytes = 33554432
host_resources = 256
tasks = 8
release_records = 512

