name = "Nexa IDL"
grammar = "nexa_idl"
path_suffixes = ["nidl"]
tab_size = 4
hard_tabs = false
line_comments = ["// "]
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = false },
    { start = "<", end = ">", close = true, newline = false },
]
