[workspace]
resolver = "2"
members = [
    "crates/*",
    "examples/combat-runtime",
    "tools/benchmark-v6",
    "tools/contract-gate-protocol",
    "tools/contract-gates",
    "tools/gate1-decision",
    "tools/gate1-v2",
    "tools/gate1-v2-4-fixtures",
    "tools/gate1-v2-5",
    "tools/gate1-v2-5-fixtures",
    "tools/gate1-v2-5-decision",
    "tools/gate1-v2-5-gates",
    "tools/gate1-v2-decision",
    "tools/gate1-v2-gates",
    "tools/gate1-experiments",
    "tools/milestone4-experiments",
    "tools/release-audit",
]
exclude = [
    "tools/allocation-observer",
    "fuzz/bytecode",
    "fuzz/bytecode-decode",
    "fuzz/verifier",
    "fuzz/root-map",
    "fuzz/wcet",
    "fuzz/host-import",
    "fuzz/state-schema",
    "fuzz/source",
    "fuzz/idl",
    "fuzz/mvr",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/S1RANN/nexa"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
