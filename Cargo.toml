[workspace]
resolver = "2"
members = [
    "crates/*",
    "examples/combat-runtime",
    "examples/hello-runtime",
    "examples/snake-game",
    "tools/xtask",
    "tools/benchmark-v6",
    "tools/benchmark-v7",
]
exclude = [
    "tools/allocation-observer",
    "fuzz/bytecode",
    "fuzz/bytecode-decode",
    "fuzz/verifier",
    "fuzz/root-map",
    "fuzz/wcet",
    "fuzz/host-import",
    "fuzz/state-schema",
    "fuzz/source",
    "fuzz/idl",
    "fuzz/realm-events",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/S1RANN/nexa"
publish = false

[workspace.dependencies]
blake3 = "1.8"
clap = { version = "4", features = ["derive", "wrap_help"] }
libm = "=0.2.16"
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
