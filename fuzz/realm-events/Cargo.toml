[package]
name = "nexa-realm-events-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nexa-bytecode = { path = "../../crates/nexa-bytecode" }
nexa-compiler = { path = "../../crates/nexa-compiler" }
nexa-migrate = { path = "../../crates/nexa-migrate" }
nexa-runtime = { path = "../../crates/nexa-runtime", features = ["fuzzing"] }
nexa-verifier = { path = "../../crates/nexa-verifier" }

[[bin]]
name = "bytecode_decode"
path = "fuzz_targets/bytecode_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verifier"
path = "fuzz_targets/verifier.rs"
test = false
doc = false
bench = false

